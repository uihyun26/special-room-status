<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 특별실 이용 현황</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>로그인</h1>
    <nav>
      <a href="index.html">현황 / 신청</a>
      <a href="mypage.html">마이페이지</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>
    <section id="login-section" class="narrow">
      <h2>학번으로 로그인</h2>
      <form class="auth-form">
        <label>
          학번
          <input type="text" name="studentId" placeholder="예) 2207">
        </label>
        <label>
          비밀번호
          <input type="password" name="password" placeholder="비밀번호 입력">
        </label>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="switch-link">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
