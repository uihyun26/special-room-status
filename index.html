<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>특별실 이용 현황 공유 및 확인 서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>특별실 이용 현황</h1>
    <nav>
      <a href="index.html">현황 / 신청</a>
      <a href="mypage.html">마이페이지</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>
    <section id="status-section">
      <h2>신청 현황</h2>
      <div class="table-wrap">
        <table class="status-table" id="status-table"></table>
      </div>
      <p class="hint">칸을 누르면 신청자·인원·목적을 볼 수 있는 기능은 다음 차시에 추가할 예정입니다.</p>
    </section>

    <section id="apply-section">
      <h2>신청하기</h2>
      <form class="apply-form">
        <label>
          신청 장소
          <select name="room" required>
            <option value="">특별실 선택</option>
          </select>
        </label>

        <label>
          신청 교시
          <select name="period" required>
            <option value="">교시 선택</option>
          </select>
        </label>

        <label>
          신청 목적
          <input type="text" name="purpose" placeholder="예) 화학실험 보고서 작성" required>
        </label>

        <label>
          사용 인원 명단 (학번/이름)
          <textarea name="members" rows="2" placeholder="예) 2207 김의현, 2208 홍길동" required></textarea>
        </label>

        <label>
          담당 교사 (있는 경우)
          <input type="text" name="teacher" placeholder="자동으로 알림이 갑니다">
        </label>

        <button type="submit" class="primary">신청하기</button>
        <p id="form-message" class="form-message" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
