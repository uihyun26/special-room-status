<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>특별실 이용 현황 공유 및 확인 서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>특별실 이용 현황</h1>
    <nav>
      <a href="index.html">현황 / 신청</a>
      <a href="mypage.html">마이페이지</a>
      <a href="teacher.html">교사 알림</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>
    <section id="status-section">
      <h2>신청 현황</h2>
      <label class="date-picker">
        조회 날짜
        <input type="date" id="view-date">
      </label>
      <label class="date-picker">
        빈 특별실 찾기
        <select id="find-period">
          <option value="">교시 선택</option>
        </select>
      </label>
      <div id="free-rooms" class="free-rooms" role="status"></div>
      <div class="table-wrap">
        <table class="status-table" id="status-table"></table>
      </div>
      <p class="hint">"신청됨" 칸을 누르면 신청자·인원·목적을 볼 수 있습니다.</p>
      <div id="detail-panel" class="detail-panel" role="status" hidden></div>
    </section>

    <section id="apply-section">
      <h2>신청하기</h2>
      <form class="apply-form">
        <label>
          신청 날짜
          <input type="date" name="date" required>
        </label>

        <label>
          신청 장소
          <select name="room" required>
            <option value="">특별실 선택</option>
          </select>
        </label>

        <label>
          신청 교시
          <select name="period" required>
            <option value="">교시 선택</option>
          </select>
        </label>

        <label>
          신청 목적
          <input type="text" name="purpose" placeholder="예) 화학실험 보고서 작성" required>
        </label>

        <div class="group-box">
          <label>
            저장된 그룹에서 명단 불러오기
            <select id="group-select">
              <option value="">그룹 선택 (선택 사항)</option>
            </select>
          </label>
        </div>

        <label>
          사용 인원 명단 (학번/이름)
          <textarea name="members" rows="2" placeholder="예) 2207 김의현, 2208 홍길동" required></textarea>
        </label>

        <div class="group-box">
          <div class="group-actions">
            <input type="text" id="group-name" placeholder="새 그룹 이름 (예: 정프 팀)" maxlength="30">
            <button type="button" class="secondary" id="group-save">현재 명단을 그룹으로 저장</button>
            <button type="button" class="secondary" id="group-delete">선택한 그룹 삭제</button>
          </div>
          <p id="group-message" class="form-message" role="status"></p>
        </div>

        <label>
          담당 교사 (있는 경우)
          <input type="text" name="teacher" placeholder="입력하면 교사 알림함에 표시됩니다">
        </label>

        <button type="submit" class="primary">신청하기</button>
        <p id="form-message" class="form-message" role="status"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
