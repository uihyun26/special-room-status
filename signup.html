<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 특별실 이용 현황</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>회원가입</h1>
    <nav>
      <a href="index.html">현황 / 신청</a>
      <a href="mypage.html">마이페이지</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>
    <section id="signup-section" class="narrow">
      <h2>회원가입</h2>
      <form class="auth-form">
        <label>
          학번
          <input type="text" name="studentId" placeholder="예) 2207">
        </label>
        <label>
          이름
          <input type="text" name="name" placeholder="이름 입력">
        </label>
        <label>
          비밀번호
          <input type="password" name="password" placeholder="비밀번호 입력">
        </label>
        <label>
          비밀번호 확인
          <input type="password" name="passwordConfirm" placeholder="비밀번호 다시 입력">
        </label>
        <button type="submit" class="primary">가입하기</button>
      </form>
      <p class="switch-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
